name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Montar e publicar ficam em jobs separados (formato recomendado pelo GitHub): no mesmo job, o deploy às vezes
  # procura o pacote um segundo depois do upload e não o encontra ("No artifacts named github-pages").
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Sem as variáveis do repositório, o build sai só com a demonstração (Nexo).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TEMA: ${{ vars.VITE_TEMA }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
